<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3f1ea"/><stop offset="1" stop-color="#dcecf4"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f7a55"/><stop offset="1" stop-color="#0a5c8a"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1b4a3a" flood-opacity="0.14"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f6a60"/></marker>
  </defs>
  <rect width="1120" height="560" rx="28" fill="url(#bg)"/>
  <text x="40" y="50" font-size="22" font-weight="700" fill="#0f2a22">REDD+ Policy Planner · agent design</text>
  <text x="40" y="74" font-size="13" fill="#4f6a60">All agents use gpt-6-luna with structured JSON output. All numbers come from engine/ tools; the Verifier is code.</text>

  <g fill="none" stroke="#4f6a60" stroke-width="1.6" marker-end="url(#ar)">
    <path d="M150 290 H185"/>
    <path d="M385 290 H415"/>
    <path d="M595 270 C625 270 615 165 645 165"/>
    <path d="M595 310 C625 310 615 415 645 415"/>
    <path d="M865 165 C890 165 880 270 905 280"/>
    <path d="M865 415 C890 415 880 310 905 300"/>
    <path d="M1000 330 V495 H90 V335" stroke-dasharray="5 4"/>
  </g>
  <g fill="none" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ar)">
    <path d="M935 245 C925 200 900 190 868 185"/>
    <path d="M935 330 C925 380 900 392 868 398"/>
  </g>
  <text x="905" y="215" font-size="11" fill="#c0392b">rejected → fix once</text>
  <text x="380" y="515" font-size="12" fill="#4f6a60">verified answer (or “Unverified” badge) · proposed dashboard state with Undo</text>

  <g filter="url(#sh)">
    <rect x="25" y="250" width="125" height="80" rx="20" fill="url(#acc)"/>
    <rect x="185" y="230" width="200" height="120" rx="20" fill="#ffffff" fill-opacity="0.75" stroke="#ffffff"/>
    <rect x="415" y="240" width="180" height="100" rx="20" fill="#ffffff" fill-opacity="0.8" stroke="#ffffff"/>
    <rect x="645" y="110" width="220" height="110" rx="20" fill="#ffffff" fill-opacity="0.8" stroke="#ffffff"/>
    <rect x="645" y="350" width="220" height="125" rx="20" fill="#ffffff" fill-opacity="0.8" stroke="#ffffff"/>
    <rect x="905" y="245" width="190" height="85" rx="20" fill="#ffffff" fill-opacity="0.8" stroke="#ffffff"/>
  </g>
  <text x="88" y="285" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Policymaker</text>
  <text x="88" y="305" text-anchor="middle" font-size="11" fill="#e6fff4">question</text>

  <text x="285" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#0f2a22">Safety gate (code)</text>
  <text x="285" y="282" text-anchor="middle" font-size="11" fill="#4f6a60">2,000-char limit · injection screen</text>
  <text x="285" y="298" text-anchor="middle" font-size="11" fill="#4f6a60">10 req/min · session token cap</text>
  <text x="285" y="314" text-anchor="middle" font-size="11" fill="#4f6a60">exact-match answer cache</text>
  <text x="285" y="332" text-anchor="middle" font-size="10.5" fill="#c0392b">blocked → Safety log</text>

  <text x="505" y="277" text-anchor="middle" font-size="14" font-weight="700" fill="#0f2a22">Orchestrator</text>
  <text x="505" y="295" text-anchor="middle" font-size="11" fill="#4f6a60">LLM router: rules · scenario</text>
  <text x="505" y="310" text-anchor="middle" font-size="11" fill="#4f6a60">compare · out of scope</text>
  <text x="505" y="325" text-anchor="middle" font-size="10.5" fill="#0f7a55">≤ 4 hops · ≤ 8 tools · 40k tokens</text>

  <text x="755" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#0f2a22">Rules Navigator</text>
  <text x="755" y="158" text-anchor="middle" font-size="11" fill="#4f6a60">cites every claim</text>
  <text x="755" y="178" text-anchor="middle" font-size="10.5" fill="#0a5c8a">search_library (BM25, top 5)</text>
  <text x="755" y="193" text-anchor="middle" font-size="10.5" fill="#0a5c8a">get_rule · get_sources</text>

  <text x="755" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#0f2a22">Scenario Analyst</text>
  <text x="755" y="398" text-anchor="middle" font-size="10.5" fill="#0a5c8a">run_simulator · score_jnr_risk</text>
  <text x="755" y="414" text-anchor="middle" font-size="10.5" fill="#0a5c8a">score_trees_risk · allocate_jnr</text>
  <text x="755" y="430" text-anchor="middle" font-size="10.5" fill="#0a5c8a">compute_trees_credits · compare_standards</text>
  <text x="755" y="446" text-anchor="middle" font-size="10.5" fill="#0a5c8a">set_dashboard_state</text>

  <text x="1000" y="275" text-anchor="middle" font-size="14" font-weight="700" fill="#0f2a22">Verifier (code)</text>
  <text x="1000" y="294" text-anchor="middle" font-size="11" fill="#4f6a60">every number ∈ tool results</text>
  <text x="1000" y="310" text-anchor="middle" font-size="11" fill="#4f6a60">every citation ∈ retrieved</text>

  <g font-size="11">
    <rect x="665" y="232" width="180" height="22" rx="11" fill="#0f7a55" fill-opacity="0.12"/>
    <text x="755" y="245" text-anchor="middle" fill="#0f7a55">library/*.md · untrusted blocks</text>
    <rect x="665" y="306" width="180" height="22" rx="11" fill="#0f7a55" fill-opacity="0.12"/>
    <text x="755" y="345" text-anchor="middle" fill="#0f7a55">engine/ math · rules/*.json</text>
  </g>
</svg>
